  --ok: #69BA7C;
  --warn: #E9B452;
  --danger: #F97770;
  --info: #E5BE86;

html, body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: var(--t-base); line-height: var(--lh); -webkit-font-smoothing: antialiased; }


/* ===== Приложение ===== */
:root { --pop-shadow: 0 12px 40px rgba(0,0,0,.28); --rl: 64%; --rs: 72%; }
html[data-tone="light"] { --pop-shadow: 0 12px 40px rgba(0,0,0,.12); --rl: 36%; --rs: 78%; }
html[data-tone="colored"] { --rl: 84%; --rs: 80%; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: var(--t-base); line-height: var(--lh); -webkit-font-smoothing: antialiased; }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 16px; height: 16px; }
[hidden] { display: none !important; }

/* Кнопки */
.btn { height: var(--ctl-h); padding: 0 14px; border-radius: var(--r-sm); border: 0; background: var(--field); color: var(--text); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .15s ease-out, color .15s ease-out; }
.btn:hover { background: var(--sel); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in oklab, var(--accent) 88%, var(--text)); }
.btn.quiet { background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--field); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.icon { width: var(--ctl-h); padding: 0; }
.btn.sm { height: 28px; padding: 0 11px; font-size: var(--t-sm); }
.btn.sm.icon { width: 28px; padding: 0; }

/* Сегменты */
.seg { display: inline-flex; background: var(--field); padding: 3px; gap: 2px; border-radius: var(--r-pill); flex: none; }
.seg button { height: 28px; padding: 0 12px; border: 0; background: transparent; color: var(--muted); border-radius: var(--r-pill); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background .15s ease-out, color .15s ease-out; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surf); color: var(--text); }

/* Поля */
.inp { width: 100%; height: var(--ctl-h); border-radius: var(--r-sm); background: var(--field); border: 1px solid var(--field-bd); padding: 0 12px; outline: none; transition: box-shadow .15s ease-out; }
textarea.inp { height: auto; min-height: 96px; padding: 8px 12px; resize: vertical; line-height: var(--lh); }
.inp::placeholder { color: var(--faint); }
.inp:focus, .inp:focus-within { box-shadow: 0 0 0 2px var(--accent); }
select.inp { cursor: pointer; }
.lbl { display: block; font-size: var(--t-sm); font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.err { font-size: var(--t-sm); color: var(--danger); margin-top: 6px; }
.inp.bad { border-color: var(--danger); }

/* Шапка */
.hdr { position: sticky; top: 0; z-index: 20; background: var(--bg); }
.hdr-in { max-width: var(--maxw); margin: 0 auto; padding: var(--pad-sm) var(--pad); display: flex; align-items: center; gap: var(--gap-sm); flex-wrap: wrap; }
.search { position: relative; width: 260px; }
.search svg { position: absolute; left: 11px; top: 9px; color: var(--faint); }
.search .inp { padding-left: 38px; }
.spacer { flex: 1; }
.theme-tile { width: var(--ctl-h); height: var(--ctl-h); border-radius: var(--r-sm); border: 0; padding: 0; cursor: pointer; overflow: hidden; display: flex; box-shadow: 0 0 0 1px var(--line); flex: none; }
.theme-tile span, .sw span { flex: 1; }

main { max-width: var(--maxw); margin: 0 auto; padding: 4px var(--pad) 28px; }

/* Панель фильтров-кнопок справа */
main { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: var(--gap); align-items: start; }
.facets { position: sticky; top: calc(var(--hdr-h, 58px) + 4px); max-height: calc(100vh - var(--hdr-h, 58px) - 16px); overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.fhead { display: flex; align-items: center; gap: 8px; min-height: 28px; margin-bottom: 6px; }
.fhead .found { font-weight: 500; flex: 1; }
.fclose, .facet-btn { display: none; }
.fgrp { margin-top: 12px; }
.fgrp .lbl { margin-bottom: 6px; }
.fbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.fb { height: 28px; max-width: 100%; padding: 0 6px 0 11px; border: 0; border-radius: var(--r-pill); background: var(--field); color: var(--text); font-size: var(--t-sm); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: background .15s ease-out, color .15s ease-out; }
.fb .ft { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb .fn { min-width: 20px; height: 20px; padding: 0 5px; border-radius: var(--r-pill); background: var(--surf); color: var(--muted); font-size: var(--t-xs); font-variant-numeric: tabular-nums; display: inline-grid; place-items: center; flex: none; }
.fb:hover { background: var(--sel); }
.fb.on { background: var(--accent); color: var(--on-accent); }
.fb.on .fn { background: color-mix(in oklab, var(--on-accent) 22%, transparent); color: var(--on-accent); }
.fb.zero:not(.on) { opacity: .45; }

/* Плитки */
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
.grid.h { grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); }
.tile { background: var(--surf); border-radius: var(--r); overflow: hidden; cursor: pointer; position: relative; transition: transform .15s ease-out; }
.tile:hover { transform: scale(1.04); z-index: 2; }
.tile .img { aspect-ratio: 2 / 3; background: var(--field); position: relative; overflow: hidden; }
.grid.h .tile .img { aspect-ratio: 460 / 215; }
.img img, .icon img, .thumb img, .pmain img, .pth img, .pe img, .cov img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .tname { background: var(--field); padding: 7px 11px; font-weight: 500; line-height: var(--lh-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .ov { left: 6px; right: 6px; bottom: 6px; gap: 6px; pointer-events: none; }
.tile .pill { height: 20px; padding: 0 8px; font-size: var(--t-xs); }
.tile .ovrate { height: 30px; min-width: 30px; padding: 0 7px; font-size: var(--t-lg); }
.rate { font-weight: var(--w-num); font-variant-numeric: tabular-nums; line-height: var(--lh-tight); }
.rate.none { color: var(--faint); }
.ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; text-align: center; font-weight: 500; font-size: var(--t-md); line-height: var(--lh-tight); color: var(--text); overflow: hidden; word-break: break-word; }
.ph.c1 { background: color-mix(in oklab, var(--chart-1) 36%, var(--surf)); }
.ph.c2 { background: color-mix(in oklab, var(--chart-2) 36%, var(--surf)); }
.ph.c3 { background: color-mix(in oklab, var(--chart-3) 50%, var(--surf)); }
.thumb .ph, .pth .ph { font-size: var(--t-xs); padding: 2px; }

/* Пустое состояние */
.empty { background: var(--surf); border-radius: var(--r); padding: 28px var(--pad); display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted); }

/* Таблица */
.twrap { background: var(--surf); border-radius: var(--r); overflow-x: auto; }
table { border-collapse: collapse; table-layout: fixed; }
th { height: var(--row-h); padding: 0 10px; text-align: left; font-size: var(--t-sm); font-weight: 500; color: var(--muted); white-space: nowrap; border-bottom: 1px solid var(--line); user-select: none; position: relative; overflow: hidden; }
th .thc { display: flex; align-items: center; gap: 4px; min-width: 0; }
th .tl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
th.c, td.c { text-align: center; padding-left: 3px; padding-right: 3px; }
th.c .thc { flex-direction: column; justify-content: center; gap: 1px; line-height: 1.2; }
th.c .tl { font-size: var(--t-xs); max-width: 100%; }
td { height: var(--row-h); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td:first-child, th:first-child { padding-left: var(--pad); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; transition: background .15s ease-out; }
tbody tr:hover { background: var(--sel); }
td.num { text-align: right; }
th.num .thc { flex-direction: row-reverse; }
td.nm { font-weight: 500; }
td.mut, td.gen { color: var(--muted); }
.thumb { width: 100%; max-width: 64px; height: 30px; border-radius: 6px; overflow: hidden; position: relative; background: var(--field); }
.rz { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; touch-action: none; }
.rz::after { content: ""; position: absolute; right: 3px; top: 12px; bottom: 12px; width: 1px; background: var(--line); transition: background .15s ease-out; }
.rz:hover::after, .rz.on::after { background: var(--accent); }
.yes { font-weight: 600; }

/* Всплывающие меню */
.tpop { position: fixed; z-index: 75; width: 336px; background: var(--surf); border-radius: var(--r); padding: 14px; box-shadow: var(--pop-shadow); transition: opacity .22s ease-out; }
.tpop.peek { opacity: 0; }
.tpop .th { display: flex; align-items: center; gap: 8px; height: 28px; margin-bottom: 11px; }
.tpop .th b { font-weight: 500; font-size: var(--t-md); }
.tgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px 8px; }
.tcell { border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
.sw { width: 100%; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; display: flex; box-shadow: 0 0 0 1px var(--line); transition: transform .15s ease-out; }
.tcell:hover .sw { transform: scale(1.06); }
.tcell.cur .sw { box-shadow: 0 0 0 2px var(--surf), 0 0 0 4px var(--text); }
.tcell small { font-size: var(--t-xs); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcell.cur small { color: var(--text); }

/* Окно игры */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; padding: 28px 18px; overflow-y: auto; animation: fade .22s ease-out; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surf); border-radius: var(--r); width: min(880px, 100%); padding: 22px; position: relative; box-shadow: var(--pop-shadow); margin: auto 0; }
.mtools { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 2; }
.mhead { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 22px; }
.mright { padding-top: 42px; min-width: 0; }
.cblock { min-width: 0; }
.cname { background: var(--field); border-radius: var(--r-sm) var(--r-sm) 0 0; padding: 8px 11px; font-size: var(--t-md); font-weight: 500; line-height: 20px; text-wrap: balance; overflow-wrap: anywhere; }
.cname-in { display: block; width: 100%; border: 0; outline: none; background: transparent; resize: none; overflow: hidden; padding: 0; font-size: var(--t-md); font-weight: 500; line-height: 20px; }
.cname-in::placeholder { color: var(--faint); }
.cname.ed { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cname.bad { box-shadow: inset 0 0 0 1.5px var(--danger); }
.icon { aspect-ratio: 2 / 3; border-radius: 0 0 var(--r-sm) var(--r-sm); overflow: hidden; position: relative; background: var(--field); }
.icon .hatch { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, var(--hatch) 0 5px, transparent 5px 10px); }
.ov { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; z-index: 1; }
.ovst { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.pill { height: 24px; max-width: 100%; padding: 0 9px; border: 0; border-radius: var(--r-pill); background: color-mix(in oklab, var(--bg) 84%, transparent); color: var(--text); font-size: var(--t-sm); font-weight: 500; display: inline-flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.my { color: var(--accent); }
.ovrate { height: 36px; min-width: 36px; padding: 0 9px; border: 0; border-radius: var(--r-sm); background: color-mix(in oklab, var(--bg) 84%, transparent); display: inline-grid; place-items: center; font-size: var(--t-xl); flex: none; }
select.pill, select.ovrate { appearance: none; -webkit-appearance: none; cursor: pointer; outline: none; box-shadow: inset 0 0 0 1.5px var(--accent); font-family: inherit; }
select.ovrate { font-weight: var(--w-num); text-align: center; text-align-last: center; }
select.pill option, select.ovrate option { background: var(--surf); color: var(--text); font-size: var(--t-base); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.sec { margin-top: 18px; }
.shead { display: flex; align-items: center; gap: 8px; min-height: 24px; margin-bottom: 8px; }
.shead .lbl { margin: 0; }
.btn.xs { height: 24px; padding: 0 9px; font-size: var(--t-xs); border-radius: 8px; gap: 4px; }
.btn.xs svg { width: 14px; height: 14px; }
.none { color: var(--faint); }
.fl { height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--t-sm); color: var(--faint); background: transparent; box-shadow: inset 0 0 0 1px var(--line); border: 0; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.fl.on { background: var(--sel); color: var(--text); box-shadow: none; }
button.fl { cursor: pointer; transition: background .15s ease-out, color .15s ease-out; }
button.fl:hover { color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
button.fl.on, button.fl.on:hover { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.icon.pick { cursor: pointer; }
.gtag { height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--t-sm); background: var(--field); color: var(--text); display: inline-flex; align-items: center; }
.desc { margin: 0; max-width: var(--read); text-wrap: pretty; white-space: pre-wrap; }
.review { background: var(--field); border-radius: var(--r-sm); padding: 14px 18px; }
.review h3 { margin: 0; font-size: var(--t-md); font-weight: 500; }
.review .shead { margin-bottom: 4px; }
.review .when { font-size: var(--t-sm); color: var(--muted); margin-bottom: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-height: 24px; }
.review .when .inp { width: auto; height: 24px; padding: 0 8px; font-size: var(--t-sm); background: var(--surf); }
.review .when label { display: inline-flex; align-items: center; gap: 6px; }
.review p { margin: 0; text-wrap: pretty; white-space: pre-wrap; }
.review textarea.inp { background: var(--surf); min-height: 120px; }
.revbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

/* Правка на месте */
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: var(--ctl-h); padding: 3px 4px; height: auto; cursor: text; }
.tags .gtag { padding-right: 4px; gap: 4px; background: var(--sel); }

.pe .pbtn:hover { background: var(--bg); }
.pe .del { top: 6px; right: 6px; width: 24px; padding: 0; justify-content: center; }

/* Просмотр фото */
.lb { position: fixed; inset: 0; z-index: 90; background: var(--scrim); animation: fade .22s ease-out; }
.lbst { position: absolute; inset: 18px 18px 72px; display: grid; place-items: center; overflow: hidden; cursor: zoom-out; }
.lbst img { max-width: 100%; max-height: 100%; border-radius: var(--r-sm); box-shadow: var(--pop-shadow); cursor: default; user-select: none; -webkit-user-drag: none; touch-action: none; }
.lbst img.zoomed { cursor: grab; }
.lbst img.dragging { cursor: grabbing; }
.lbx { position: absolute; top: 14px; right: 14px; z-index: 1; }
.lbbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); height: 44px; padding: 0 18px; border-radius: var(--r-pill); background: var(--surf); box-shadow: var(--pop-shadow); display: flex; align-items: center; gap: 11px; font-size: var(--t-sm); color: var(--muted); white-space: nowrap; }
.lbbar input { width: 220px; accent-color: var(--accent); }
.lbbar b { color: var(--text); font-weight: 600; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

/* Вход */
.login { min-height: 100vh; display: grid; place-items: center; padding: 18px; }
.login .card { background: var(--surf); border-radius: var(--r); padding: 22px; width: min(380px, 100%); display: grid; gap: 14px; }
.logo { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; }
.login .brand { display: flex; align-items: center; gap: 11px; }
.login h1 { margin: 0; font-size: var(--t-lg); font-weight: 500; }
.login .hint { font-size: var(--t-sm); color: var(--faint); margin: 0; }
.login .btn { width: 100%; }

/* Тост */
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--sel); color: var(--text); border-radius: var(--r-sm); padding: 10px 14px; z-index: 95; box-shadow: var(--pop-shadow); animation: fade .15s ease-out; }

/* Телефон */
@media (max-width: 900px) {
  .search { flex: 1; min-width: 160px; width: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .facet-btn, .fclose { display: inline-flex; }
  .facets { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: min(300px, 88vw); max-height: none; z-index: 40; background: var(--surf); padding: 14px; box-shadow: var(--pop-shadow); }
  body.fopen .facets { display: block; }
}
@media (max-width: 700px) {
  :root { --pad: 16px; --gap: 12px; }
  .hdr-in { padding: 8px var(--pad); }
  .search { order: 10; flex-basis: 100%; }
  .grid, .grid.h { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile:hover { transform: none; }
  .scrim { padding: 0; }
  .modal { width: 100%; min-height: 100%; border-radius: 0; padding: 18px var(--pad) 28px; box-shadow: none; margin: 0; }
  .mhead { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .cblock { width: min(240px, 100%); margin-top: 40px; }
  .mright { padding-top: 0; }
  .pe { width: calc(50% - 4px); }
  .lbbar input { width: 140px; }
  .tpop { width: calc(100vw - 24px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ================= Хранилище ================= */
// В localStorage — только настройки вида. Игры живут в Supabase (таблица games, картинки — бакет game-images).
function lsGet(k, def) { try { const v = localStorage.getItem(LS + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); return true; } catch (e) { toast('Не хватает места в хранилище браузера'); return false; } }

const SUPABASE_URL = 'https://vlffntfnwyhdnkhosvfo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsZmZudGZud3loZG5raG9zdmZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTY1NTIsImV4cCI6MjEwNDM3MjU1Mn0.2g6RrFBT6vvXNpl6OU-tnsd86rChfqQNKthpQSvZeIA';

function errText(e) { return (e && (e.message || e.error_description)) || String(e); }

async function loadGames() {
  S.load = 'loading'; S.loadErr = ''; render();
  try {
    const rows = [], PAGE = 1000;
    for (let from = 0; ; from += PAGE) {
      const { data, error } = await sb.from('games').select('id,data').order('id').range(from, from + PAGE - 1);
      if (error) throw error;
      rows.push(...data);
      if (data.length < PAGE) break;
    }
    S.games = rows.map(r => r.data).filter(Boolean);
    S.games.forEach(g => { if (MY_STATUS_RENAMED[g.myStatus]) g.myStatus = MY_STATUS_RENAMED[g.myStatus]; });
    S.load = 'ok';
  } catch (e) { S.load = 'error'; S.loadErr = errText(e); }
  if (S.user) render();
}
async function putGame(g) {
  const { error } = await sb.from('games').upsert({ id: g.id, data: g, updated_at: new Date().toISOString() });
  if (error) throw error;
}
async function removeGame(id) {
  const { error } = await sb.from('games').delete().eq('id', id);
  if (error) throw error;
}

/* ================= Картинки из бакета ================= */
// В данных картинка из бакета — строка «sb:<путь>»; показывается по подписанной ссылке, ссылки берутся пачкой.
const SIGNED = new Map(); // путь → ссылка
let signWant = new Set(), signT = null;
function isSb(src) { return typeof src === 'string' && src.startsWith('sb:'); }
function srcOf(src) { return isSb(src) ? SIGNED.get(src.slice(3)) || null : src; }
function wantSigned(path) { if (SIGNED.has(path)) return; signWant.add(path); if (!signT) signT = setTimeout(flushSigned, 0); }
async function flushSigned() {
  signT = null; const paths = [...signWant]; signWant = new Set(); if (!paths.length) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths, SIGN_TTL);
  if (error || !data) return;
  data.forEach(x => { if (x.signedUrl && x.path) SIGNED.set(x.path, x.signedUrl); });
  document.querySelectorAll('[data-sb]').forEach(el => { const u = SIGNED.get(el.dataset.sb); if (u) el.outerHTML = imgTag(u, el.dataset.name); });
}
async function signedNow(src) {
  if (!isSb(src)) return src;
  const p = src.slice(3); if (SIGNED.has(p)) return SIGNED.get(p);
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(p, SIGN_TTL);
  if (error || !data) return null;
  SIGNED.set(p, data.signedUrl); return data.signedUrl;
}
async function uploadImage(gameId, blob) {
  const rnd = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const path = `${gameId}/${rnd}.jpg`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw error;
  SIGNED.set(path, URL.createObjectURL(blob)); // своё только что загруженное показываем сразу, без запроса ссылки
  return 'sb:' + path;
}

const $ = s => document.querySelector(s);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const IC = {
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',

  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
};
function ic(n, cls = 's') { return `<svg class="i ${cls}" viewBox="0 0 24 24">${IC[n]}</svg>`; }
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function ph(name) { return `<div class="ph c${1 + hash(name) % 3}">${esc(name || 'Без названия')}</div>`; }
function imgTag(src, name) {
  if (!src) return ph(name);
  if (isSb(src)) {
    const u = srcOf(src);
    if (!u) { const p = src.slice(3); wantSigned(p); return ph(name).replace('<div ', `<div data-sb="${esc(p)}" data-name="${esc(name)}" `); }
    src = u;
  }
  return `<img src="${esc(src)}" alt="" loading="lazy" data-name="${esc(name)}" onerror="imgFail(this)">`;
}
window.imgFail = function (el) { el.insertAdjacentHTML('afterend', ph(el.dataset.name)); el.remove(); };
function coverOf(g, shape) { return shape === 'h' ? (g.coverH || g.cover || g.coverV) : (g.coverV || g.cover || g.coverH); }
function ratingColor(r) {
  if (r == null || r === '') return 'var(--faint)';
  const h = r <= 5 ? (r - 1) / 4 * 55 : 55 + (r - 5) / 5 * 75;

/* Ширины колонок: своя ширина (перетаскиванием) запоминается в drozdgames.colw.
   Остальные колонки ужимаются до минимумов, чтобы таблица влезла в экран; не влезает — прокрутка вбок. */
const CW_DEF = { cover: 80, name: 180, rating: 84, gameStatus: 140, myStatus: 140, genres: 140 }, CW_FLAG = 56;
const CW_MIN = { cover: 56, name: 110, rating: 56, gameStatus: 104, myStatus: 104, genres: 86 }, CW_FLAG_MIN = 44;
S.colw = lsGet('colw', {});
function colIds() { return ['cover', ...COLS.map(c => c.id)]; }
function colWidths() {
  const ids = colIds(), w = {}, min = {};
  ids.forEach(id => { min[id] = CW_MIN[id] || CW_FLAG_MIN; w[id] = S.colw[id] || CW_DEF[id] || CW_FLAG; });
  const avail = Math.max(0, ($('#list').clientWidth || innerWidth) - 1);
  const sum = () => ids.reduce((s, id) => s + w[id], 0);
  const free = ids.filter(id => !S.colw[id]);
  let over = sum() - avail;
  if (over > 0) {
    const room = free.reduce((s, id) => s + w[id] - min[id], 0);
    const k = room > 0 ? Math.min(1, over / room) : 0;
    free.forEach(id => { w[id] = Math.floor(w[id] - (w[id] - min[id]) * k); });
  } else if (over < 0) {
    // лишнее место — названию (или первой не заданной вручную колонке), только на экране
    const to = ['name', 'genres', 'myStatus', 'gameStatus'].find(id => !S.colw[id]);
    if (to) w[to] += -over;
  }
  return w;
}

  const review = saved ? saved.review || '' : '';
  let revBtn = '';
  if (me && saved && !M.revEdit) revBtn = review ? `<button class="btn xs" data-act="rev">${ic('pen')} Изменить отзыв</button>` : `<button class="btn xs" data-act="rev">${ic('plus')} Написать отзыв</button>`;
  const when = ed
    ? `<label>Добавлено <input class="inp" type="date" data-f="added" value="${esc(g.added)}"></label><label>Играл: <input class="inp" type="month" data-f="playedFrom" value="${esc(g.playedFrom)}"></label><label>— <input class="inp" type="month" data-f="playedTo" value="${esc(g.playedTo)}" title="Пусто — играю сейчас"></label>`
    : `${g.added ? `<span>Добавлено ${fmtDate(g.added)}</span>` : ''}${played ? `<span>Играл: ${played}</span>` : ''}`;
  const revBody = M.revEdit
    ? `<textarea class="inp" id="revIn" rows="5" placeholder="Что думаю об игре">${esc(review)}</textarea><div class="revbtns"><button class="btn" data-act="revcancel">Отмена</button><button class="btn ${ed ? '' : 'primary'}" data-act="revsave">Сохранить отзыв</button></div>`
    : review ? `<p>${esc(review)}</p>` : `<p class="none">${M.isNew && me ? 'Отзыв можно написать после сохранения игры' : 'Отзыва пока нет'}</p>`;

  return `
  <div class="mtools">${tools}</div>
  <div class="mhead">
    <div class="cblock">
      ${nameStrip}
      <div class="icon ${ed ? 'pick' : ''}" ${ed ? 'data-act="pickcover" title="Сменить картинку"' : ''}>${cov ? imgTag(cov, g.name) : (ed ? '<div class="hatch"></div>' : ph(g.name))}
        <div class="ov"><div class="ovst">${ovSt}</div>${ovRate}</div>
      </div>
      ${M.err ? `<div class="err">${M.err}</div>` : ''}
    </div>
    <div class="mright">
      ${flags}
      ${genresSec}
    </div>
  </div>
  ${descSec}
  ${photoSec}
  <div class="sec review">
    <div class="shead"><h3>Мой отзыв</h3>${revBtn}</div>
    <div class="when">${when}</div>
    ${revBody}
  </div>
  ${ed ? `<input type="file" id="fCover" accept="image/*" hidden>
  <input type="file" id="fPhotos" accept="image/*" multiple hidden>` : ''}`;
}
function tagsHTML(d) { return d.genres.map((x, i) => `<span class="gtag">${esc(x)}<button type="button" data-delg="${i}" title="Убрать">${ic('x')}</button></span>`).join('') + `<input id="gIn" list="genreList" placeholder="${d.genres.length ? '' : 'Начните вводить, Enter — добавить'}">`; }
function renderTags() { $('#tags').innerHTML = tagsHTML(M.draft); $('#gIn').focus(); }
function addGenre(v) {
  v = (v || '').trim().replace(/,$/, '').trim(); if (!v) return;
  const known = allGenres().find(x => x.toLowerCase() === v.toLowerCase());
  if (!M.draft.genres.some(x => x.toLowerCase() === v.toLowerCase())) M.draft.genres.push(known || v);
  renderTags();
}
function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
// Перерисовывается только содержимое окна: подложка остаётся, анимация открытия не повторяется, прокрутка сохраняется.
function renderModal() {
  if (!M) return;
  const g = M.mode === 'edit' ? M.draft : game();
  if (!g) { closeModal(); return; }
  const r = $('#modalRoot');
  let modal = r.querySelector('.modal');
  if (!modal) {
    r.innerHTML = '<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true"></div></div>';
    modal = r.querySelector('.modal');
  }
  modal.innerHTML = modalHTML();
  document.body.classList.add('lock');
  modal.querySelectorAll('.cname-in').forEach(autosize);
  if (M.busy) setBusy(true);
}
function startEdit() {
  M.draft = JSON.parse(JSON.stringify(game()));
  M.draft.flags = { ...fl(), ...(M.draft.flags || {}) }; M.draft.photos = M.draft.photos || []; M.draft.genres = M.draft.genres || [];
  M.orig = JSON.stringify(M.draft); M.mode = 'edit'; M.err = ''; M.genEdit = false; M.descEdit = false; M.revEdit = false;
  renderModal();
}
function toRead() { M = { id: M.id, mode: 'read' }; renderModal(); }
// Пока запрос идёт — кнопки сохранения и удаления неактивны.
function setBusy(on) {
  if (M) M.busy = on;
  root.querySelectorAll('[data-act="save"],[data-act="delete"],[data-act="revsave"]').forEach(b => { b.disabled = on; });
}
async function saveEdit() {
  if (M.busy) return;
  const d = M.draft; const pend = $('#gIn'); if (pend && pend.value.trim()) addGenre(pend.value);
  d.name = (d.name || '').trim();
  if (!d.name) { M.err = 'Нужно название'; renderModal(); $('.cname-in').focus(); return; }
  if (!d.added) d.added = today();
  const prev = S.games.find(g => g.id === d.id);
  if (prev) d.review = prev.review || '';
  const out = JSON.parse(JSON.stringify(d));
  setBusy(true);
  try { await putGame(out); }
  catch (e) { setBusy(false); toast('Не сохранилось: ' + errText(e)); return; }
  M && (M.busy = false);
  const i = S.games.findIndex(g => g.id === out.id);
  if (i < 0) S.games.push(out); else S.games[i] = out;
  if (M && M.id === out.id && M.mode === 'edit') toRead();
  render();
}
async function saveReview() {
  const g = game(), t = $('#revIn'); if (!g || !t || M.busy) return;
  const out = { ...JSON.parse(JSON.stringify(g)), review: t.value.trim() };
  setBusy(true);
  try { await putGame(out); }
  catch (e) { setBusy(false); toast('Не сохранилось: ' + errText(e)); return; }
  g.review = out.review;
  if (!M || M.id !== out.id) { render(); return; }
  M.busy = false;
  if (M.draft) { M.draft.review = g.review; const o = JSON.parse(M.orig); o.review = g.review; M.orig = JSON.stringify(o); }
  M.revEdit = false; renderModal(); render();
}
function downscale(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('bad image')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function setCover(src) { M.draft.cover = src; M.draft.coverV = null; M.draft.coverH = null; }
function focusEnd(sel) { const t = $(sel); if (t) { t.focus(); const n = t.value.length; t.setSelectionRange(n, n); } }
const root = document.getElementById('modalRoot');
root.addEventListener('click', e => {
  if (!M) return;
  if (e.target.id === 'scrim') { if (!dirty()) closeModal(); return; }
  const a = e.target.closest('[data-act]'), act = a && a.dataset.act;
  if (act === 'close') return closeModal();
  if (act === 'edit') return startEdit();
  if (act === 'rev') { M.revEdit = true; renderModal(); return focusEnd('#revIn'); }
  if (act === 'revcancel') { M.revEdit = false; return renderModal(); }
  if (act === 'revsave') return saveReview();
  const z = e.target.closest('[data-zoom]');
  if (z && !e.target.closest('.pbtn')) return openLightbox((M.mode === 'edit' ? M.draft : game()).photos[+z.dataset.zoom]);
  if (M.mode !== 'edit') return;
  const d = M.draft;
  if (act === 'save') return saveEdit();
  if (act === 'cancel') { if (M.isNew) return closeModal(); return toRead(); }
  if (act === 'delete') {
    if (!confirm(`Удалить «${d.name || 'без названия'}»? Это нельзя отменить.`)) return;
    if (M.busy) return;
    setBusy(true);
    removeGame(d.id).then(() => { S.games = S.games.filter(g => g.id !== d.id); if (M && M.id === d.id) closeModal(); render(); },
      err => { setBusy(false); toast('Не удалилось: ' + errText(err)); });
    return;
  }
  if (act === 'pickcover') { if (e.target.closest('select')) return; return $('#fCover').click(); }
  if (act === 'pickphotos') return $('#fPhotos').click();
  if (act === 'editgen') { M.genEdit = true; renderModal(); return $('#gIn').focus(); }
  if (act === 'editdesc') { M.descEdit = true; renderModal(); return focusEnd('[data-f="description"]'); }
  const f = e.target.closest('[data-flag]'); if (f) { d.flags[f.dataset.flag] = !d.flags[f.dataset.flag]; return renderModal(); }
  const dg = e.target.closest('[data-delg]'); if (dg) { d.genres.splice(+dg.dataset.delg, 1); return renderTags(); }
  const dp = e.target.closest('[data-delph]'); if (dp) { d.photos.splice(+dp.dataset.delph, 1); return renderModal(); }
  const mk = e.target.closest('[data-mkcover]'); if (mk) { setCover(d.photos[+mk.dataset.mkcover]); toast('Фото стало обложкой'); return renderModal(); }
  if (e.target.closest('#tags')) $('#gIn').focus();
});
function setField(t) {
  const f = t.dataset.f;
  M.draft[f] = f === 'rating' ? (t.value ? +t.value : null) : t.value;
  if (f === 'name') { autosize(t); if (M.err && t.value.trim()) { M.err = ''; t.parentElement.classList.remove('bad'); const er = root.querySelector('.err'); if (er) er.remove(); } }
  if (f === 'rating') t.style.color = ratingColor(M.draft.rating);
}
root.addEventListener('input', e => {
  if (!M || M.mode !== 'edit') return;
  if (e.target.dataset.f) return setField(e.target);
  if (e.target.id === 'gIn') {
    const v = e.target.value;
    if (v.includes(',')) { v.split(',').slice(0, -1).forEach(x => { const t = x.trim(); if (t && !M.draft.genres.some(y => y.toLowerCase() === t.toLowerCase())) M.draft.genres.push(allGenres().find(y => y.toLowerCase() === t.toLowerCase()) || t); }); renderTags(); $('#gIn').value = v.split(',').pop().trimStart(); return; }
    if (e.inputType === 'insertReplacementText' || e.inputType == null) { if (allGenres().some(x => x.toLowerCase() === v.trim().toLowerCase())) addGenre(v); }
  }
});
root.addEventListener('change', async e => {
  if (!M || M.mode !== 'edit') return;
  if (e.target.dataset.f) return setField(e.target);
  if (e.target.id === 'fCover' || e.target.id === 'fPhotos') {
    const files = [...e.target.files]; if (!files.length) return;
    const d = M.draft, isCover = e.target.id === 'fCover';
    let blobs;
    try { blobs = await Promise.all(files.map(downscale)); }
    catch (err) { toast('Не получилось прочитать картинку'); return; }
    toast('Загружаю картинку…');
    let urls;
    try { urls = await Promise.all(blobs.map(b => uploadImage(d.id, b))); }
    catch (err) { toast('Картинка не загрузилась: ' + errText(err)); return; }
    if (!M || M.mode !== 'edit' || M.draft !== d) return;
    if (isCover) setCover(urls[0]); else d.photos.push(...urls);
    toast(isCover ? 'Картинка загружена' : (urls.length > 1 ? 'Фото загружены' : 'Фото загружено'));
    renderModal();
  }
});
root.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('cname-in') && e.key === 'Enter') { e.preventDefault(); return; }
  if (e.target.id !== 'gIn') return;
  if (e.key === 'Enter') { e.preventDefault(); addGenre(e.target.value); }
  else if (e.key === 'Backspace' && !e.target.value && M.draft.genres.length) { M.draft.genres.pop(); renderTags(); }
});
root.addEventListener('focusout', e => { if (e.target.id === 'gIn' && e.target.value.trim() && M && M.mode === 'edit') { const v = e.target.value; setTimeout(() => { if (M && M.mode === 'edit' && $('#gIn') && $('#gIn').value === v) addGenre(v); }, 120); } });

/* ================= Просмотр фото ================= */
// На весь экран: ползунок 100–400 %, колесо мыши, при увеличении картинку можно таскать. Закрыть — ✕, клик по фону, Esc.
let lb = null;
async function openLightbox(src) {
  if (!src) return;
  if (isSb(src)) { src = await signedNow(src); if (!src) return toast('Не получилось открыть фото'); }
  closeLightbox();
  lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `<div class="lbst"><img src="${esc(src)}" alt="" draggable="false"></div>
    <button class="btn icon lbx" title="Закрыть">${ic('x', '')}</button>
    <div class="lbbar">Масштаб <input type="range" min="100" max="400" step="5" value="100"><b>100 %</b></div>`;
  document.body.appendChild(lb);
  const st = lb.querySelector('.lbst'), img = st.querySelector('img'), rng = lb.querySelector('input'), out = lb.querySelector('b');
  const Z = { s: 1, x: 0, y: 0 };
  const apply = () => {
    const mx = img.offsetWidth * (Z.s - 1) / 2, my = img.offsetHeight * (Z.s - 1) / 2;
    Z.x = Math.max(-mx, Math.min(mx, Z.x)); Z.y = Math.max(-my, Math.min(my, Z.y));
    img.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
    rng.value = Math.round(Z.s * 100); out.textContent = Math.round(Z.s * 100) + ' %';
    img.classList.toggle('zoomed', Z.s > 1);
  };
  rng.addEventListener('input', () => { Z.s = rng.value / 100; apply(); });
  st.addEventListener('wheel', e => { e.preventDefault(); Z.s = Math.min(4, Math.max(1, Z.s * Math.pow(1.0015, -e.deltaY))); apply(); }, { passive: false });
  img.addEventListener('pointerdown', e => {
    if (Z.s <= 1 || e.button !== 0) return;
    e.preventDefault(); img.setPointerCapture(e.pointerId); img.classList.add('dragging');
    const sx = e.clientX - Z.x, sy = e.clientY - Z.y;
    const mv = ev => { Z.x = ev.clientX - sx; Z.y = ev.clientY - sy; apply(); };
    const up = () => { img.removeEventListener('pointermove', mv); img.removeEventListener('pointerup', up); img.removeEventListener('pointercancel', up); img.classList.remove('dragging'); };
    img.addEventListener('pointermove', mv); img.addEventListener('pointerup', up); img.addEventListener('pointercancel', up);
  });
  st.addEventListener('click', e => { if (e.target === st) closeLightbox(); });
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  lb.querySelector('.lbx').addEventListener('click', closeLightbox);
}
function closeLightbox() { if (lb) { lb.remove(); lb = null; } }

/* ================= События страницы ================= */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (lb) return closeLightbox();
  if (tpop) return closeThemePop();
  if (S.facetsOpen) return setFacetsOpen(false);
  if (M) return closeModal();
});
document.addEventListener('click', e => {
  if (S.facetsOpen && !e.target.closest('#facets, #facetBtn')) setFacetsOpen(false);
  if (tpop && !tpop.contains(e.target) && !e.target.closest('#themeBtn')) closeThemePop();
});
let resizeT;
window.addEventListener('resize', () => {
  if (tpop) placeTpop();
  clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.view === 'table' && S.user) render(); }, 120);
});
// Прокрутка внутри самого меню его не закрывает — закрывает только прокрутка страницы.

$('#viewSeg').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (!b) return; S.view = b.dataset.view; saveView(); render(); });
$('#shapeSeg').addEventListener('click', e => { const b = e.target.closest('[data-shape]'); if (!b) return; S.shape = b.dataset.shape; saveView(); render(); });
$('#logoutBtn').addEventListener('click', async () => { $('#logoutBtn').disabled = true; await sb.auth.signOut(); $('#logoutBtn').disabled = false; signedOut(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#addBtn').addEventListener('click', openNew);
$('#themeBtn').addEventListener('click', e => { e.stopPropagation(); openThemePop(); });
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#lgBtn'), er = $('#lgErr'); er.hidden = true; btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#lgMail').value.trim(), password: $('#lgPass').value });
  btn.disabled = false;
  if (error || !data.session) {
    er.textContent = error && /invalid login credentials/i.test(error.message) ? 'Неверная почта или пароль' : 'Не удалось войти: ' + errText(error);
    er.hidden = false; return;
  }
  $('#lgPass').value = '';
  signedIn(data.session);
});

$('#facetBtn').addEventListener('click', () => setFacetsOpen(!S.facetsOpen));
$('#facets').addEventListener('click', e => {
  e.stopPropagation(); // панель перерисовывается — клик не должен считаться «мимо» и закрывать её на телефоне
  const b = e.target.closest('[data-fg]'); if (b) return toggleFacet(b.dataset.fg, b.dataset.fv);
  if (e.target.closest('[data-freset]')) { S.facets = {}; saveView(); return render(); }
  if (e.target.closest('[data-fclose]')) setFacetsOpen(false);
});
// Перетаскивание края заголовка меняет ширину колонки
$('#list').addEventListener('pointerdown', e => {
  const rz = e.target.closest('[data-rz]'); if (!rz || e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const id = rz.dataset.rz, table = rz.closest('table');
  const cols = [...table.querySelectorAll('col')];
  cols.forEach(c => { c.style.width = table.querySelector(`th[data-c="${c.dataset.c}"]`).getBoundingClientRect().width + 'px'; });
  const col = table.querySelector(`col[data-c="${id}"]`), startW = parseFloat(col.style.width), sx = e.clientX;
  const total = () => cols.reduce((s, c) => s + parseFloat(c.style.width), 0);
  table.style.width = total() + 'px';
  rz.classList.add('on'); rz.setPointerCapture(e.pointerId);
  const move = ev => { col.style.width = Math.max(40, Math.round(startW + ev.clientX - sx)) + 'px'; table.style.width = total() + 'px'; };
  const up = () => {
    rz.removeEventListener('pointermove', move); rz.removeEventListener('pointerup', up); rz.removeEventListener('pointercancel', up);
    rz.classList.remove('on');
    S.colw[id] = Math.round(parseFloat(col.style.width)); lsSet('colw', S.colw);
    setTimeout(render, 0);
  };
  rz.addEventListener('pointermove', move); rz.addEventListener('pointerup', up); rz.addEventListener('pointercancel', up);
});
$('#list').addEventListener('click', e => {
  if (e.target.closest('[data-rz]')) return;
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'add') return openNew();
  if (a && a.dataset.act === 'reload') return loadGames();
  if (a && a.dataset.act === 'clearall') { S.q = ''; $('#q').value = ''; S.facets = {}; saveView(); return render(); }
  const o = e.target.closest('[data-open]'); if (o) openGame(o.dataset.open);
});

if (!THEMES.some(t => t[0] === curTheme())) applyTheme(DEFAULT_THEME);
else applyTheme(curTheme());

/* ================= Вход ================= */
function signedIn(session) {
  if (S.user && S.user.id === session.user.id) return;
  S.user = session.user; loadGames();
}
function signedOut() {
  S.user = null; S.games = []; S.load = 'idle'; S.loadErr = ''; SIGNED.clear();
  render();
}
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT' || !session) { if (S.user) signedOut(); } });
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) signedIn(data.session); else render();
})();
</script>
</body>
</html>
